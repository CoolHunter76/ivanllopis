services:
  web:
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_VERSION: "${APP_VERSION:-3.0.0.0}"
      APP_COMMIT: "${APP_COMMIT:-unknown}"
    build: .
    container_name: ivanllopis-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.cv
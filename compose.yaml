name: ivanllopis-production

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ivanllopis-web
    restart: unless-stopped
    environment:
      APP_ENV: production
      AI_ASSISTANT_ENABLED: "false"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 7s
      retries: 3
      start_period: 15s

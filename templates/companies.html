<section class="companies" aria-labelledby="companies-title">
  <h2 id="companies-title">Empresas con las que he trabajado</h2>
  <div class="company-logos">
    {% for slug, name in [('hp','HP'),('repsol','Repsol'),('mapfre','MAPFRE'),('adif','Adif'),('energyavm','Enérgya-VM'),('capgemini','Capgemini'),('sogeti','Sogeti')] %}
      <div class="company-logo">
        <img src="{{ url_for('static', filename='images/companies/' ~ slug ~ '.svg') }}" alt="{{ name }}" loading="lazy">
      </div>
    {% endfor %}
  </div>
</section>

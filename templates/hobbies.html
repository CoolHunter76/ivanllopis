{% extends "base.html" %}{% block content %}<section class="section page-hero page-hobbies"><p class="eyebrow">{{ t.personal.eyebrow }}</p><h1>{{ t.hobbies.title }}</h1><p class="lead">{{ t.hobbies.intro }}</p></section><section class="section hobby-grid">{% for hobby in hobbies %}<article class="hobby-card hobby-{{ hobby.id }}"><span class="hobby-icon" aria-hidden="true"><img src="{{ hobby.icon }}" alt=""></span><h2>{{ t.hobbies["items"][hobby.id].title }}</h2><p>{{ t.hobbies["items"][hobby.id].text }}</p></article>{% endfor %}</section>{% endblock %}

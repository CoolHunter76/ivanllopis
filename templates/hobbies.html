{% extends "base.html" %}
{% block content %}
<section class="section hobbies-page reveal visible">
    <div class="section-heading">
        <p class="eyebrow">{{ t.nav_hobbies }}</p>
        <h1>{{ t.hobbies_title }}</h1>
        <p>{{ t.hobbies_intro }}</p>
    </div>

    <div class="hobbies-grid">
        {% for icon, name in hobbies %}
        <article class="hobby-card">
            <span class="hobby-icon" aria-hidden="true">{{ icon }}</span>
            <h2>{{ name }}</h2>
        </article>
        {% endfor %}
    </div>

    <a href="/{{ lang }}" class="button secondary">{{ t.back_home }}</a>
</section>
{% endblock %}

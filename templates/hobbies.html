{% extends "base.html" %}{% block content %}<section class="section hobbies-page"><header class="section-heading"><p class="eyebrow">{{ t.nav.hobbies }}</p><h1>{{ t.hobbies.title }}</h1><p>{{ t.hobbies.intro }}</p></header><div class="hobby-grid">{% for hobby in hobbies %}<article class="hobby-card"><img src="{{ hobby.icon }}" alt="" width="46" height="46"><h2>{{ t.hobbies["items"][hobby.id].title }}</h2><p>{{ t.hobbies["items"][hobby.id].text }}</p></article>{% endfor %}</div><a class="button secondary" href="/{{ lang }}">{{ t.hobbies.back }}</a></section>{% endblock %}

<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07110b">
  <link rel="icon" href="/static/images/favicon.ico">
  <link rel="manifest" href="/static/site.webmanifest">
  <link rel="stylesheet" href="/static/css/site.css?v=2">
</head>
<body>
  <a class="skip-link" href="#main">{{ t.skip }}</a>
  <header class="site-header">
    <a class="brand" href="/{{ lang }}" aria-label="IvanLlopis.net">IVANLLOPIS<span>.NET</span></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav" class="site-nav" aria-label="{{ t.nav_label }}">
      <a href="#profile">{{ t.nav_profile }}</a><a href="#capabilities">{{ t.nav_capabilities }}</a><a href="#projects">{{ t.nav_projects }}</a><a href="#journey">{{ t.nav_journey }}</a><a href="/{{ lang }}/hobbies">{{ t.nav_hobbies }}</a>
    </nav>
    <label class="language"><span class="sr-only">{{ t.language }}</span><select id="language-select" aria-label="{{ t.language }}">{% for code in language_data %}<option value="{{ code }}" {% if code == lang %}selected{% endif %}>{{ code|upper }}</option>{% endfor %}</select></label>
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
  <footer class="site-footer"><span>© 2026 IvanLlopis.net</span><span>{{ t.footer }}</span></footer>
  <script src="/static/js/site.js?v=2" defer></script>
</body>
</html>

{% extends "base.html" %}{% block content %}<section class="section page-hero page-request-cv"><p class="eyebrow">{{ t.cv_request.eyebrow }}</p><h1>{{ t.cv_request.title }}</h1><p class="lead">{{ t.cv_request.intro }}</p></section><section class="section form-shell"><form id="cv-request-form" class="cv-form"><label>{{ t.cv_request.name }}<input name="name" minlength="2" maxlength="120" required autocomplete="organization"></label><label>{{ t.cv_request.email }}<input name="email" type="email" maxlength="254" required autocomplete="email"></label><label>{{ t.cv_request.phone }} <small>{{ t.cv_request.optional }}</small><input name="phone" type="tel" maxlength="40" autocomplete="tel"></label><label>{{ t.cv_request.message }}<textarea name="message" minlength="10" maxlength="1500" required rows="7"></textarea></label><label class="honeypot" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label><label class="consent"><input name="consent" type="checkbox" required><span>{{ t.cv_request.consent }} <a href="/{{ lang }}/privacy">{{ t.cv_request.privacy_link }}</a> · <a href="{{ t.cv_request.official_url }}" target="_blank" rel="noopener noreferrer">{{ t.cv_request.official_link }}</a></span></label><button class="button primary" type="submit">{{ t.cv_request.submit }}</button><p id="cv-form-status" class="form-status" role="status" aria-live="polite" data-success="{{ t.cv_request.success }}" data-error="{{ t.cv_request.error }}"></p></form></section>{% endblock %}

name: GitFlow Policy

on:
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  gitflow-policy:
    name: gitflow-policy
    runs-on: ubuntu-latest

    steps:
      - name: Validate source and target branches
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          echo "Validating $HEAD_BRANCH -> $BASE_BRANCH"

          case "$BASE_BRANCH" in
            develop)
              if [[ "$HEAD_BRANCH" == feature/* ||
                    "$HEAD_BRANCH" == bugfix/* ||
                    "$HEAD_BRANCH" == dependabot/* ]]; then
                echo "Valid GitFlow pull request: $HEAD_BRANCH -> $BASE_BRANCH"
              else
                echo "Pull requests to develop must come from feature/*, bugfix/* or dependabot/*."
                exit 1
              fi
              ;;

            master)
              if [[ "$HEAD_BRANCH" == release/* ||
                    "$HEAD_BRANCH" == hotfix/* ]]; then
                echo "Valid GitFlow pull request: $HEAD_BRANCH -> $BASE_BRANCH"
              else
                echo "Pull requests to master must come from release/* or hotfix/*."
                exit 1
              fi
              ;;

            *)
              echo "Unsupported target branch: $BASE_BRANCH"
              exit 1
              ;;
          esac

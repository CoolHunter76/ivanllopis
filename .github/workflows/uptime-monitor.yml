name: Uptime Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read

concurrency:
  group: public-smoke-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    name: monitor-environments
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run public smoke checks
        run: python scripts/public_smoke.py --output public-smoke-report.json

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-smoke-report
          path: public-smoke-report.json
          if-no-files-found: error
          retention-days: 14

name: Verify Environment Isolation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches:
      - develop
      - master
    paths:
      - "deploy/**"
      - "nginx/**"
      - "server/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: isolation-verification
  cancel-in-progress: true

jobs:
  verify:
    name: verify-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Verify production and staging isolation
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/verify-ivanllopis-isolation"

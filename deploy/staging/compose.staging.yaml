name: ivanllopis-staging

services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - /opt/ivanllopis/staging/shared/.env.cv

    restart: unless-stopped

    environment:
      V3_PORTAL_ENABLED: "true"
      APP_ENV: "${APP_ENV:-staging}"
      APP_VERSION: "${APP_VERSION:-}"
      APP_COMMIT: "${APP_COMMIT:-unknown}"

    ports:
      - "127.0.0.1:8001:8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
